<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Shop</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial;
  background: #ffffff;
  color: #111;
  height: 100vh;
  display: flex;
  justify-content: center;
}

/* container */
.container {
  width: 100%;
  max-width: 820px;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* chat */
.chat {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* messages */
.msg {
  padding: 12px 14px;
  border-radius: 14px;
  max-width: 80%;
  line-height: 1.4;
  animation: fade 0.2s ease-in;
  font-size: 15px;
}

/* user bubble */
.user {
  align-self: flex-end;
  background: #f3f4f6;
  color: #111;
}

/* AI bubble */
.ai {
  align-self: flex-start;
  background: #ffffff;
  border: 1px solid #e5e7eb;
  color: #111;
}

@keyframes fade {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

/* CENTER START */
.center {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.title {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 18px;
}

/* language buttons */
.langs {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.lang {
  padding: 10px 16px;
  border-radius: 999px;
  border: 1px solid #ddd;
  cursor: pointer;
  transition: 0.2s;
  background: #fff;
}

.lang:hover {
  background: #f5f5f5;
}

/* input bar */
.inputBar {
  display: flex;
  padding: 14px;
  border-top: 1px solid #e5e7eb;
  gap: 10px;
  background: #fff;
}

input {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #e5e7eb;
  outline: none;
  font-size: 14px;
}

/* send button (ChatGPT style) */
.send {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: #111;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s;
}

.send:hover {
  transform: scale(1.05);
  background: #000;
}

.send svg {
  width: 18px;
  height: 18px;
  fill: white;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">

  <!-- START SCREEN -->
  <div class="center" id="center">
    <div class="title">AI Shop Assistant</div>
    <div class="langs">
      <div class="lang" onclick="start('TKM')">TKM</div>
      <div class="lang" onclick="start('RU')">RU</div>
    </div>
  </div>

  <!-- CHAT -->
  <div class="chat" id="chat"></div>

  <!-- INPUT -->
  <div class="inputBar">
    <input id="msg" placeholder="Напиши товар..." onkeydown="handleKey(event)" />
    <button class="send" onclick="send()">
      <svg viewBox="0 0 24 24">
        <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
      </svg>
    </button>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
