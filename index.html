<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Shop</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial;
  background: #0a0a0a;
  color: white;
  height: 100vh;
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 800px;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* TOP CHAT AREA */
.chat {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* MESSAGE */
.msg {
  padding: 12px 14px;
  border-radius: 14px;
  max-width: 80%;
  line-height: 1.4;
  animation: fade 0.2s ease-in;
}

.user {
  align-self: flex-end;
  background: #2a2a2a;
}

.ai {
  align-self: flex-start;
  background: #161616;
}

@keyframes fade {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

/* CENTER SCREEN */
.center {
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.title {
  font-size: 26px;
  font-weight: 600;
  margin-bottom: 20px;
  opacity: 0.9;
}

/* BUTTONS TKM / RU */
.langs {
  display: flex;
  gap: 12px;
  justify-content: center;
}

.lang {
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid #333;
  cursor: pointer;
  transition: 0.2s;
}

.lang:hover {
  background: #1f1f1f;
}

/* INPUT AREA */
.inputBar {
  display: flex;
  padding: 15px;
  gap: 10px;
  border-top: 1px solid #222;
}

input {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: none;
  outline: none;
  background: #1a1a1a;
  color: white;
  font-size: 14px;
}

/* SEND BUTTON (ChatGPT style) */
.send {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: white;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s;
}

.send:hover {
  transform: scale(1.05);
}

.send svg {
  width: 18px;
  height: 18px;
  fill: black;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">

  <!-- CENTER -->
  <div class="center" id="center">
    <div class="title">AI Shop Assistant</div>
    <div class="langs">
      <div class="lang" onclick="start('TKM')">TKM</div>
      <div class="lang" onclick="start('RU')">RU</div>
    </div>
  </div>

  <!-- CHAT -->
  <div class="chat" id="chat"></div>

  <!-- INPUT -->
  <div class="inputBar">
    <input id="msg" placeholder="Напиши товар..." onkeydown="handleKey(event)" />
    <button class="send" onclick="send()">
      <svg viewBox="0 0 24 24">
        <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
      </svg>
    </button>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
