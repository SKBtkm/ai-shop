<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Shop</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial;
  background: #0b0b0f;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* контейнер */
.app {
  width: 420px;
  height: 600px;
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  backdrop-filter: blur(20px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

/* чат */
.chat {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
}

/* сообщения */
.msg {
  margin: 10px 0;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeIn 0.3s forwards;
}

.user {
  text-align: right;
  color: #7aa2ff;
}

.ai {
  text-align: left;
  color: #ffffff;
}

/* input */
.inputBox {
  display: flex;
  padding: 10px;
  border-top: 1px solid rgba(255,255,255,0.1);
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.08);
  color: white;
}

button {
  margin-left: 10px;
  padding: 12px 16px;
  border-radius: 12px;
  border: none;
  background: #3b82f6;
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.05);
}

@keyframes fadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="chat" id="chat"></div>

  <div class="inputBox">
    <input id="msg" placeholder="Напиши товар..." />
    <button onclick="send()">→</button>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
